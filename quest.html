<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="일일 퀘스트를 달성하고 상자를 열어 보상을 받는 희라링고 퀘스트 화면."
    />
    <meta property="og:title" content="희라링고 - 퀘스트" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <script
      src="https://kit.fontawesome.com/3c2e0fd26e.js"
      crossorigin="anonymous"
    ></script>
    <title>희라링고 - 퀘스트</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="side-nav" id="side-nav"></nav>

      <div class="phone">
        <div class="top"></div>
        <div class="page-content" id="main"></div>
        <div class="bottom"></div>
      </div>

      <aside class="status-panel" id="status-panel"></aside>
    </div>

    <script src="data.js"></script>
    <script src="common.js"></script>
    <script>
      const state = loadState();
      saveState(state);
      renderTopBar(state);
      renderBottomNav("quest");
      renderSideNav("quest");
      renderStatusPanel(state);
      renderChestBadge(state);

      const main = document.getElementById("main");

      // 퀘스트 완료 여부만 보여주는 읽기 전용 화면. 상자는 레슨을 마칠 때 자동으로 지급되고
      // 그 자리에서 바로 열게 되므로, 여기서는 따로 받기/열기 버튼이 없음.
      const cardsHtml = QUEST_DEFS.map((q) => {
        const value = Math.min(q.getValue(state), q.goal);
        const pct = Math.round((value / q.goal) * 100);
        const done = value >= q.goal;
        return `
          <div class="quest-card">
            <div class="quest-icon">${q.icon}</div>
            <div class="quest-info">
              <p>${q.label}</p>
              <div class="quest-progress-track"><div class="quest-progress-fill" style="width:${pct}%"></div></div>
            </div>
            <div class="quest-status ${done ? "done" : ""}">
              ${done ? '<i class="fa-solid fa-circle-check"></i>' : `${value}/${q.goal}`}
            </div>
          </div>
        `;
      }).join("");

      main.innerHTML = `
        <div class="page-title">일일 퀘스트</div>
        <div class="quest-list">${cardsHtml}</div>
      `;
    </script>
  </body>
</html>
